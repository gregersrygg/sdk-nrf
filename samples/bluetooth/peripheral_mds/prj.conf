CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_Memfault"
CONFIG_BT_PRIVACY=y

CONFIG_BT_BAS=y
CONFIG_BT_MDS=y

CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_BACKEND_RTT=n

CONFIG_SHELL=y
CONFIG_SENSOR_SHELL=n
CONFIG_DK_LIBRARY=y

# Heap memory is required for the memfault_demo_cli.c
CONFIG_HEAP_MEM_POOL_SIZE=256

CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_SHELL=y
CONFIG_MEMFAULT_LOGGING_ENABLE=y
CONFIG_MEMFAULT_LOG_LEVEL_INF=y

# BLE/MDS gateway path: the phone uploads chunks over HTTP, so on-device HTTP
# stays disabled and CONFIG_MEMFAULT_PROJECT_KEY (gated behind MEMFAULT_HTTP_ENABLE)
# cannot be used. The key is served to the gateway via the MDS Authorization
# characteristic, sourced from CONFIG_MEMFAULT_NCS_PROJECT_KEY.
CONFIG_MEMFAULT_NCS_PROJECT_KEY="UQhnIEBjXEGBCb9s1AENeAYril4WE4cj" # Quickstart Shared Project
CONFIG_MEMFAULT_NCS_FW_TYPE="main"

# Allow provisioning the project key at runtime from the settings subsystem
# (key "memfault/project_key"). A stored key overrides the compile-time value
# above; with no stored key the compile-time value is used as a fallback.
# Provision over serial with the settings shell, e.g.:
#   settings set memfault/project_key <your-32-char-key>
CONFIG_MEMFAULT_PROJECT_KEY_SETTINGS=y
CONFIG_SETTINGS_SHELL=y

# Derive the Memfault device ID from the chip's unique 64-bit FICR DEVICEID via
# the hw_id library (formatted as 16 hex chars). This makes every board report a
# unique ID. The same value is discoverable from the PC with nrfutil:
#   nrfutil device read --address 0x00FFC304 --bytes 8 --direct --serial-number <SN>
# which prints DEVICEID[0] then DEVICEID[1]; the Memfault ID is the two 32-bit
# words in hex, swapped: hex(DEVICEID[1]) + hex(DEVICEID[0]).
CONFIG_MEMFAULT_NCS_DEVICE_ID_HW_ID=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y

CONFIG_MEMFAULT_NCS_BT_METRICS=y

# Quick Start demo: collect a heartbeat every 60s (default 3600s) so data keeps
# flowing during a short session, drain buffered chunks to the gateway within
# ~1s (default 60000ms), and give the event buffer headroom for the faster
# cadence while disconnected.
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=60
CONFIG_BT_MDS_DATA_POLL_INTERVAL=1000
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=4096

# The default 8192B coredump region is too small for this build's coredump
# (~9.3 KB with the configured stack/data/kernel regions), so Memfault would
# refuse to store it. Give it headroom.
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_SIZE=16384

# Enable bonding
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

CONFIG_BT_DIS_FW_REV_STR="1.0.0"
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_FW_VERSION="1.0.0"
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.0"

# Enable OTA updates
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# Populate more fields in the nRF Connect Device Manager OS view
CONFIG_MCUMGR_GRP_OS_INFO=y

# Device Information Service (required for OTA)
CONFIG_BT_DIS=y
CONFIG_BT_DIS_SERIAL_NUMBER=y
CONFIG_BT_DIS_SERIAL_NUMBER_STR="mfltqs1"
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="nrf54l15dk"
CONFIG_BT_DIS_SW_REV=y
CONFIG_BT_DIS_SW_REV_STR="main"
CONFIG_BT_DIS_FW_REV=y
